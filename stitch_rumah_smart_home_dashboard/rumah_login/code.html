<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rumah — Masuk Sistem</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-highest": "#dfe4df",
            "tertiary-fixed": "#ffdad4",
            "on-tertiary-fixed": "#370e08",
            "on-secondary": "#ffffff",
            "primary": "#115344",
            "on-secondary-fixed": "#091f19",
            "inverse-surface": "#2c322e",
            "on-tertiary-container": "#ffd3cc",
            "tertiary-container": "#8c5148",
            "primary-container": "#2f6b5b",
            "background": "#f6fbf5",
            "on-tertiary-fixed-variant": "#6d3830",
            "surface-container-lowest": "#ffffff",
            "primary-fixed-dim": "#96d3bf",
            "primary-fixed": "#b1efdb",
            "on-surface-variant": "#404945",
            "on-surface": "#181d1a",
            "on-secondary-fixed-variant": "#354b44",
            "tertiary": "#703a32",
            "surface-tint": "#2c6859",
            "on-secondary-container": "#536961",
            "surface-container-low": "#f0f5f0",
            "on-primary": "#ffffff",
            "error-container": "#ffdad6",
            "on-tertiary": "#ffffff",
            "inverse-on-surface": "#edf2ed",
            "on-error-container": "#93000a",
            "surface-bright": "#f6fbf5",
            "on-primary-fixed-variant": "#0d5041",
            "surface-variant": "#dfe4df",
            "surface-container": "#ebefea",
            "inverse-primary": "#96d3bf",
            "secondary-fixed": "#cfe8de",
            "secondary": "#4d635b",
            "surface-dim": "#d7dbd6",
            "on-error": "#ffffff",
            "on-primary-fixed": "#002019",
            "on-primary-container": "#abe9d5",
            "surface-container-high": "#e5e9e4",
            "outline-variant": "#bfc9c4",
            "secondary-fixed-dim": "#b4ccc2",
            "outline": "#707975",
            "secondary-container": "#cfe8de",
            "error": "#ba1a1a",
            "surface": "#f6fbf5",
            "tertiary-fixed-dim": "#ffb4a8",
            "on-background": "#181d1a"
          },
          fontFamily: {
            "body-md": ["Public Sans", "sans-serif"],
            "body-sm": ["Public Sans", "sans-serif"],
            "body-lg": ["Public Sans", "sans-serif"],
            "mono-metric": ["IBM Plex Mono", "monospace"],
            "mono-body": ["IBM Plex Mono", "monospace"],
            "headline-sm": ["Public Sans", "sans-serif"],
            "mono-sm": ["IBM Plex Mono", "monospace"],
            "headline-lg": ["Public Sans", "sans-serif"],
            "label-md": ["Public Sans", "sans-serif"],
            "headline-md": ["Public Sans", "sans-serif"],
            "headline-lg-mobile": ["Public Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style>
    * {
      box-shadow: none !important;
      text-shadow: none !important;
      backdrop-filter: none !important;
    }
    body {
      background-color: #F4F1EA;
      color: #181d1a;
      -webkit-font-smoothing: antialiased;
      font-family: 'Public Sans', sans-serif;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#E4EDE9] selection:text-[#2F6B5B]">
<!-- Header Bar: Minimal architectural status header -->
<header class="w-full border-b border-[#D9D3C6] bg-transparent px-6 h-14 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="font-bold text-[18px] tracking-tight text-[#181d1a]">Rumah</span>
<span class="text-[#D9D3C6] select-none">/</span>
<span class="text-[14px] text-[#404945]">Rumah Tangga</span>
</div>
<div class="flex items-center gap-2 px-3 py-1 bg-[#E4EDE9] rounded-[8px]">
<span class="w-2 h-2 rounded-full bg-[#2F6B5B]"></span>
<span class="text-[13px] font-medium text-[#2F6B5B]">Server terhubung</span>
</div>
</header>
<!-- Central Canvas: Single Centered Card -->
<main class="flex-1 flex items-center justify-center p-6 my-auto">
<div class="w-full max-w-[440px] bg-[#FBF9F4] rounded-[20px] p-8">
<!-- Header Bagian Card -->
<div class="pb-5 mb-5 border-b border-[#E5E0D5]">
<div class="flex items-center justify-between mb-1">
<h1 class="text-[24px] font-semibold text-[#181d1a] tracking-tight" id="card-title">Masuk ke Rumah</h1>
<span class="text-[12px] font-medium px-2 py-0.5 rounded bg-[#ECE7DC] text-[#404945]" id="step-badge">Tahap 1/2</span>
</div>
<p class="text-[14px] text-[#404945]" id="card-subtitle">Rumah Tangga</p>
</div>
<!-- Tab Selector Navigasi State -->
<div class="flex p-1 bg-[#EFECE3] rounded-[12px] mb-6 gap-1">
<button class="flex-1 h-9 rounded-[10px] text-[13px] font-medium bg-[#FBF9F4] text-[#181d1a] transition-none flex items-center justify-center gap-1.5 cursor-pointer border-0" id="tab-step1" onclick="switchStep(1)" type="button">
<span>Akun Pengguna</span>
</button>
<button class="flex-1 h-9 rounded-[10px] text-[13px] font-medium text-[#404945] hover:text-[#181d1a] transition-none flex items-center justify-center gap-1.5 cursor-pointer bg-transparent border-0" id="tab-step2" onclick="switchStep(2)" type="button">
<span>Verifikasi 2 Langkah</span>
</button>
</div>
<!-- Step 1 View: Masuk Utama -->
<div class="block" id="step1-view">
<form class="space-y-4" onsubmit="event.preventDefault(); switchStep(2);">
<div>
<label class="block text-[13px] font-medium text-[#181d1a] mb-1.5" for="username">Nama Pengguna</label>
<input class="w-full h-[44px] px-3.5 bg-white border border-[#D9D3C6] rounded-[12px] text-[15px] text-[#181d1a] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" id="username" name="username" placeholder="Masukkan nama pengguna..." required="" type="text" value="budi"/>
</div>
<div>
<div class="flex justify-between items-center mb-1.5">
<label class="block text-[13px] font-medium text-[#181d1a] mb-0" for="password">Kata Sandi</label>
</div>
<input class="w-full h-[44px] px-3.5 bg-white border border-[#D9D3C6] rounded-[12px] text-[15px] text-[#181d1a] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" id="password" name="password" placeholder="Masukkan kata sandi..." required="" type="password" value="••••••••••••"/>
</div>
<div class="pt-2">
<button class="w-full h-[44px] bg-[#2F6B5B] hover:bg-[#255849] active:bg-[#1F4A3D] text-white text-[14px] font-medium rounded-[12px] flex items-center justify-center gap-2 border-0 cursor-pointer transition-colors" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Step 2 View: Verifikasi 2 Langkah (6-digit TOTP) -->
<div class="hidden" id="step2-view">
<form class="space-y-5" onsubmit="event.preventDefault(); verifyCode();">
<div>
<div class="flex items-center justify-between mb-2">
<label class="block text-[13px] font-medium text-[#181d1a]">
              Kode Verifikasi 6-Digit
            </label>
<span class="text-[12px] font-['IBM_Plex_Mono',monospace] text-[#404945]">
              Sisa: <span class="font-semibold text-[#2F6B5B]" id="timer">24s</span>
</span>
</div>
<!-- 6 discrete 44x44px boxes in IBM Plex Mono -->
<div class="flex items-center justify-between gap-1.5" id="otp-container">
<input class="w-[44px] h-[44px] text-center bg-white border border-[#D9D3C6] rounded-[12px] font-['IBM_Plex_Mono',monospace] text-[18px] font-semibold text-[#2F6B5B] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text" value="4"/>
<input class="w-[44px] h-[44px] text-center bg-white border border-[#D9D3C6] rounded-[12px] font-['IBM_Plex_Mono',monospace] text-[18px] font-semibold text-[#2F6B5B] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text" value="8"/>
<input class="w-[44px] h-[44px] text-center bg-white border border-[#D9D3C6] rounded-[12px] font-['IBM_Plex_Mono',monospace] text-[18px] font-semibold text-[#2F6B5B] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text" value="2"/>
<input class="w-[44px] h-[44px] text-center bg-white border border-[#D9D3C6] rounded-[12px] font-['IBM_Plex_Mono',monospace] text-[18px] font-semibold text-[#2F6B5B] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text" value="0"/>
<input class="w-[44px] h-[44px] text-center bg-white border border-[#D9D3C6] rounded-[12px] font-['IBM_Plex_Mono',monospace] text-[18px] font-semibold text-[#2F6B5B] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text" value="9"/>
<input class="w-[44px] h-[44px] text-center bg-white border border-[#D9D3C6] rounded-[12px] font-['IBM_Plex_Mono',monospace] text-[18px] font-semibold text-[#2F6B5B] focus:outline-none focus:border-[#2F6B5B] focus:ring-0" inputmode="numeric" maxlength="1" pattern="[0-9]" placeholder="·" type="text"/>
</div>
</div>
<div class="space-y-2 pt-1">
<button class="w-full h-[44px] bg-[#2F6B5B] hover:bg-[#255849] active:bg-[#1F4A3D] text-white text-[14px] font-medium rounded-[12px] flex items-center justify-center gap-2 border-0 cursor-pointer transition-colors" type="submit">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span>Verifikasi &amp; Masuk</span>
</button>
<button class="w-full h-[44px] bg-transparent border border-[#D9D3C6] hover:bg-[#ECE7DC] text-[#181d1a] text-[14px] font-medium rounded-[12px] flex items-center justify-center cursor-pointer transition-colors" onclick="switchStep(1)" type="button">
            Kembali
          </button>
</div>
</form>
</div>
<!-- Metadata Singkat (Protokol MQTT) -->
<div class="mt-6 pt-4 border-t border-[#E5E0D5] flex items-center justify-between text-[13px] text-[#404945]">
<span>Protokol Jaringan</span>
<span class="font-['IBM_Plex_Mono',monospace] text-[13px] text-[#181d1a]">MQTT</span>
</div>
</div>
</main>
<!-- Grounded Household Policy Footer -->
<footer class="w-full border-t border-[#D9D3C6] bg-transparent px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-[#2F6B5B]"></span>
<p class="text-[13px] text-[#404945]">
      Akses terbatas untuk penghuni rumah. Tidak terhubung ke cloud publik.
    </p>
</div>
<div class="flex items-center gap-4 text-[#404945] text-[13px]">
<span>Protokol MQTT</span>
<span class="text-[#D9D3C6]">•</span>
<span>2026</span>
</div>
</footer>
<script>
  function switchStep(step) {
    const step1View = document.getElementById('step1-view');
    const step2View = document.getElementById('step2-view');
    const tab1 = document.getElementById('tab-step1');
    const tab2 = document.getElementById('tab-step2');
    const badge = document.getElementById('step-badge');
    const title = document.getElementById('card-title');

    if (step === 1) {
      step1View.classList.remove('hidden');
      step2View.classList.add('hidden');
      tab1.className = "flex-1 h-9 rounded-[10px] text-[13px] font-medium bg-[#FBF9F4] text-[#181d1a] transition-none flex items-center justify-center gap-1.5 cursor-pointer border-0";
      tab2.className = "flex-1 h-9 rounded-[10px] text-[13px] font-medium text-[#404945] hover:text-[#181d1a] transition-none flex items-center justify-center gap-1.5 cursor-pointer bg-transparent border-0";
      badge.textContent = "Tahap 1/2";
      title.textContent = "Masuk ke Rumah";
    } else {
      step1View.classList.add('hidden');
      step2View.classList.remove('hidden');
      tab2.className = "flex-1 h-9 rounded-[10px] text-[13px] font-medium bg-[#FBF9F4] text-[#181d1a] transition-none flex items-center justify-center gap-1.5 cursor-pointer border-0";
      tab1.className = "flex-1 h-9 rounded-[10px] text-[13px] font-medium text-[#404945] hover:text-[#181d1a] transition-none flex items-center justify-center gap-1.5 cursor-pointer bg-transparent border-0";
      badge.textContent = "Tahap 2/2";
      title.textContent = "Verifikasi 2 Langkah";

      const inputs = document.querySelectorAll('#otp-container input');
      if (inputs.length > 0) {
        inputs[inputs.length - 1].focus();
      }
    }
  }

  // Keyboard navigation helper across digit cells
  const inputs = document.querySelectorAll('#otp-container input');
  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      if (input.value.length === 1 && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].focus();
      }
    });
  });

  // Countdown timer simulation for TOTP interval
  let secondsLeft = 24;
  const timerEl = document.getElementById('timer');
  setInterval(() => {
    secondsLeft--;
    if (secondsLeft < 1) secondsLeft = 30;
    if (timerEl) {
      timerEl.textContent = `${secondsLeft}s`;
    }
  }, 1000);

  function verifyCode() {
    const btn = event.target.querySelector('button[type="submit"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">check_circle</span> Terverifikasi. Mengalihkan...`;
    btn.classList.add('bg-[#115344]');
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.classList.remove('bg-[#115344]');
    }, 1500);
  }
</script>
</body></html>
