<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes scanMotion {
      0%, 100% {
        top: 8px;
      }
      50% {
        top: calc(100% - 10px);
      }
    }
    .scan-line {
      position: absolute;
      left: 12px;
      right: 12px;
      height: 2px;
      animation: scanMotion 3s ease-in-out infinite;
    }
  </style>

<body class="bg-surface text-on-surface h-full flex items-center justify-center m-0 p-0 antialiased selection:bg-secondary-fixed">
<!-- Native Android Frame (360 x 800) -->
<main class="relative w-[360px] h-[800px] overflow-hidden flex flex-col bg-[#151816] text-[#E8E6DF] select-none">
<!-- Android Native Status Bar -->
<header class="w-full h-7 pt-1 px-margin flex justify-between items-center z-20 shrink-0">
<span class="font-label-md text-label-md text-[#E8E6DF] font-semibold tracking-normal">09:41</span>
<div class="flex items-center gap-1.5 text-[#E8E6DF]">
<span class="material-symbols-outlined text-[16px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[16px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[18px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Top App Bar for Task/Scan Flow (Suppressed BottomNavBar as this is a focused task destination) -->
<div class="w-full h-14 px-margin flex items-center justify-between z-20 shrink-0">
<button aria-label="Tutup" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-[#E8E6DF] active:bg-[#1D211E] transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="close">close</span>
</button>
<h1 class="font-title-md text-title-md font-semibold text-[#E8E6DF] tracking-tight">Scan QR</h1>
<button aria-label="Senter" class="w-11 h-11 -mr-2 rounded-full flex items-center justify-center text-[#E8E6DF] active:bg-[#1D211E] transition-colors" id="torch-toggle" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="flashlight_on">flashlight_on</span>
</button>
</div>
<!-- Center Camera Viewfinder Area -->
<section class="flex-1 flex flex-col items-center justify-center px-margin z-10">
<!-- Scan Target Container (220 x 220 px) -->
<div class="relative w-[220px] h-[220px] bg-[#1D211E] rounded-xl overflow-hidden flex items-center justify-center">
<!-- Subtle Alignment Grid Matrix for Quiet Domesticity Tone -->
<div class="absolute inset-0 grid grid-cols-3 grid-rows-3 opacity-20 pointer-events-none">
<div class="border-r border-b border-[#5E655F]"></div>
<div class="border-r border-b border-[#5E655F]"></div>
<div class="border-b border-[#5E655F]"></div>
<div class="border-r border-b border-[#5E655F]"></div>
<div class="border-r border-b border-[#5E655F]"></div>
<div class="border-b border-[#5E655F]"></div>
<div class="border-r border-[#5E655F]"></div>
<div class="border-r border-[#5E655F]"></div>
<div></div>
</div>
<!-- 4 Corner Bracket Framing (Accent Color #5FA08E / Domestic Sanctuary Tone) -->
<!-- Top Left -->
<div class="absolute top-2 left-2 w-6 h-6 border-t-2 border-l-2 border-[#5FA08E] rounded-tl-[6px] pointer-events-none"></div>
<!-- Top Right -->
<div class="absolute top-2 right-2 w-6 h-6 border-t-2 border-r-2 border-[#5FA08E] rounded-tr-[6px] pointer-events-none"></div>
<!-- Bottom Left -->
<div class="absolute bottom-2 left-2 w-6 h-6 border-b-2 border-l-2 border-[#5FA08E] rounded-bl-[6px] pointer-events-none"></div>
<!-- Bottom Right -->
<div class="absolute bottom-2 right-2 w-6 h-6 border-b-2 border-r-2 border-[#5FA08E] rounded-br-[6px] pointer-events-none"></div>
<!-- Moving Flat Accent Scanning Line (Flat solid bar, strict no-glow rule) -->
<div class="scan-line bg-[#5FA08E] rounded-full pointer-events-none"></div>
<!-- Central Alignment Dot Indicator -->
<div class="w-1.5 h-1.5 rounded-full bg-[#5FA08E] opacity-60"></div>
</div>
<!-- Domestic Guidance Microcopy -->
<div class="mt-8 px-4 text-center">
<p class="font-body-md text-body-md text-[#E8E6DF] leading-snug">
          Arahkan kamera ke QR di stiker alat
        </p>
<p class="font-body-sm text-body-sm text-[#9CA39E] mt-1.5">
          Pastikan kode berada di dalam kotak bidik
        </p>
</div>

      </button>

<div class="w-18 w-[72px] h-1 bg-[#E8E6DF] opacity-40 rounded-full"></div>
</div>

</main>
<script>
    const torchBtn = document.getElementById('torch-toggle');
    let torchActive = false;
    if (torchBtn) {
      torchBtn.addEventListener('click', () => {
        torchActive = !torchActive;
        const icon = torchBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = torchActive ? 'flashlight_off' : 'flashlight_on';
          torchBtn.classList.toggle('text-[#5FA08E]', torchActive);
          torchBtn.classList.toggle('text-[#E8E6DF]', !torchActive);
        }
      });
    }
  </script>
