</main>
<script>
    // Lightweight auto-advance interaction for OTP input fields
    const inputs = document.querySelectorAll('#otp-container input');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
      input.addEventListener('focus', () => {
        inputs.forEach((inp) => {
          inp.classList.remove('border-2', 'border-primary-container');
          inp.classList.add('border-0');
        });
        input.classList.remove('border-0');
        input.classList.add('border-2', 'border-primary-container');
      });
    });
  </script>
