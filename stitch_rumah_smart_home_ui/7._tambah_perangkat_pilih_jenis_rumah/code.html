<body class="flex justify-center items-center min-h-screen bg-[#ECE7DC] sm:py-6">
<!-- Mobile Android Container (360 x 800) -->
<main class="relative w-[360px] h-[800px] bg-[#F4F1EA] overflow-hidden flex flex-col justify-between select-none">
<!-- Top Section (Status Bar, App Bar, Wizard Intro) -->
<div class="w-full flex flex-col">
<!-- Android Status Bar (24px) -->
<div class="w-full h-6 px-4 flex justify-between items-center text-[#1F2421] text-xs pt-1 z-10">
<span class="font-medium tracking-tight">09:41</span>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[15px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[15px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px]" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Top Bar (Navigation) -->
<header class="h-14 px-margin flex items-center bg-[#F4F1EA]">
<button aria-label="Kembali" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-[#1F2421] active:bg-[#ECE7DC] transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[24px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="ml-2 font-title-md text-title-md text-[#1F2421]">Tambah perangkat</h1>
</header>
<!-- Wizard Step Header & Helper Text -->
<div class="px-margin pt-4 pb-2">
<p class="font-body-md text-body-md text-[#5E655F]">
          Pilih jenis perangkat yang ingin ditambahkan ke rumah.
        </p>
</div>
<!-- Device Option Cards List -->
<section aria-label="Daftar Jenis Perangkat" class="px-margin pt-4 space-y-3">
<!-- Card 1: Modul Rumah (ESP32) -->
<button class="w-full text-left bg-[#FBF9F4] rounded-2xl p-4 flex items-center justify-between active:bg-[#E4EDE9] transition-colors duration-150 min-h-[76px] cursor-pointer" type="button">
<div class="flex items-center space-x-3.5">
<!-- Inset Round Icon Container -->
<div class="w-12 h-12 rounded-full bg-[#ECE7DC] flex items-center justify-center flex-shrink-0 text-primary-container">
<span class="material-symbols-outlined text-[24px]" data-icon="memory">memory</span>
</div>
<!-- Labels -->
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-[#1F2421]">Modul Rumah (ESP32)</span>
<span class="font-body-sm text-body-sm text-[#5E655F] mt-0.5">Lampu, kipas, sensor, alarm</span>
</div>
</div>
<!-- Trailing Chevron -->
<div class="flex items-center text-[#5E655F] pl-2 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Card 2: Kamera dari HP bekas -->
<button class="w-full text-left bg-[#FBF9F4] rounded-2xl p-4 flex items-center justify-between active:bg-[#E4EDE9] transition-colors duration-150 min-h-[76px] cursor-pointer" type="button">
<div class="flex items-center space-x-3.5">
<!-- Inset Round Icon Container -->
<div class="w-12 h-12 rounded-full bg-[#ECE7DC] flex items-center justify-center flex-shrink-0 text-primary-container">
<span class="material-symbols-outlined text-[24px]" data-icon="videocam">videocam</span>
</div>
<!-- Labels -->
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-[#1F2421]">Kamera dari HP bekas</span>
<span class="font-body-sm text-body-sm text-[#5E655F] mt-0.5">Pakai HP lama sebagai kamera</span>
</div>
</div>
<!-- Trailing Chevron -->
<div class="flex items-center text-[#5E655F] pl-2 flex-shrink-0">
<span class="material-symbols-outlined text-[20px]" data-icon="chevron_right">chevron_right</span>
</div>
</button>
