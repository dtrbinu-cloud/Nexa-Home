<!-- Android Frame 360x800 -->

<!-- Top Area (Status Bar + TopAppBar + Privacy Banner) -->
<header class="w-full shrink-0">

<div class="w-full h-6 px-margin flex items-center justify-between text-on-surface">

<div class="flex items-center space-x-1">

<span class="material-symbols-outlined text-[16px]" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- TopAppBar -->
<div class="flex justify-between items-center w-full px-margin h-16 max-w-[360px] mx-auto">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Kamera</h1>
<!-- Contextual Action: Add Camera Button -->
<button aria-label="Tambah kamera" class="w-11 h-11 rounded-full bg-secondary-fixed flex items-center justify-center text-primary-container transition-colors duration-150 active:opacity-80">
<span class="material-symbols-outlined text-[24px]" data-icon="add">add</span>
</button>
</div>
<!-- Privacy Mode Banner / Status Strip Card -->
<div class="px-margin pt-1 pb-2">
<div class="rounded-[20px] bg-surface-variant px-space-md py-space-sm flex items-center gap-space-xs">
<span class="material-symbols-outlined text-secondary text-[20px] shrink-0" data-icon="visibility_off">visibility_off</span>
<p class="font-body-sm text-body-sm text-secondary truncate">
            Mode privasi aktif, kamera Kamar dimatikan
          </p>
</div>
</div>

<div class="grid grid-cols-2 gap-gutter">
<!-- Camera Tile 1: Teras -->
<article class="bg-surface rounded-[20px] p-space-xs flex flex-col gap-2">
<!-- 16:9 Placeholder Area -->
<div class="aspect-video w-full rounded-[14px] bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[24px]" data-icon="videocam">videocam</span>
</div>

<div class="px-space-xxs pb-1 flex flex-col gap-1">
<h2 class="font-body-md text-body-md text-on-surface font-semibold truncate">Teras</h2>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-tertiary-container inline-block"></span>
<span class="font-body-sm text-body-sm text-tertiary-container font-medium">Live</span>
</div>
<p class="font-mono-data-sm text-mono-data-sm text-secondary">720p 15fps</p>
</div>
</article>
<!-- Camera Tile 2: Ruang tamu -->
<article class="bg-surface rounded-[20px] p-space-xs flex flex-col gap-2">
<!-- 16:9 Placeholder Area -->
<div class="aspect-video w-full rounded-[14px] bg-surface-variant flex items-center justify-center">

</div>
<p class="font-mono-data-sm text-mono-data-sm text-secondary">720p 15fps</p>
</div>
</article>
